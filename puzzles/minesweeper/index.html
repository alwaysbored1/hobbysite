outline:3px solid #2364D2;outline-offset:3px}#new{background:#269B48;color:white}.stats{display:flex;justify-content:center;gap:10px;margin:14px 0}.stat{background:#d8d8d8;border:2px solid #555;padding:6px 10px;text-align:center;min-width:96px;font-size:12px}.stat strong{display:block;font:900 23px Arial,sans-serif;margin-top:2px;font-variant-numeric:tabular-nums}#board-wrap{overflow:auto;text-align:center}svg{display:block;margin:auto;max-width:100%;height:auto;user-select:none;touch-action:manipulation}.tile{cursor:pointer;outline:none}.tile polygon{fill:url(#covered);stroke:#555;stroke-width:2}.tile:hover polygon{fill:#eee}.tile.open polygon{fill:#dedede;stroke:#999;stroke-width:1.5}.tile.zero polygon{fill:#d2d2d2}.tile.flagged polygon{fill:#e5d8ef}.tile.bomb polygon{fill:#aaa}.tile.exploded polygon{fill:#E32636;stroke:#222;stroke-width:3}.tile.wrong polygon{fill:#ffc1c1}.tile:focus-visible polygon{stroke:#2364D2;stroke-width:4}.tile text{pointer-events:none;text-anchor:middle;dominant-baseline:central;font-family:'Comic Sans MS','Comic Sans',cursive;font-weight:900;paint-order:stroke;stroke:#ffffff55;stroke-width:.6}#status{text-align:center;min-height:24px;margin:10px 0 4px;font-size:15px}#details{text-align:center;font-size:12px;color:#444;margin:0 0 8px}.rules{border-top:2px solid #888;padding-top:10px;text-align:center;font-size:12px;line-height:1.7}.legend{display:flex;justify-content:center;gap:12px;margin:6px 0}.won{animation:rainbow 1s steps(1,end) 3}@keyframes rainbow{0%,100%{border-color:#E32636}16%{border-color:#FF8C28}33%{border-color:#FFD23F}50%{border-color:#269B48}66%{border-color:#2364D2}83%{border-color:#9C47CF}}@media(max-width:480px){.app{margin:0;padding:8px}.stat{min-width:80px;padding:5px}.controls button{padding:7px 10px}}\n\n/* Reveal only newly opened cells; all delays are cosmetic. */\n.tile.revealing polygon,.tile.revealing text{transform-box:fill-box;transform-origin:center;animation:hex-reveal 220ms ease-out var(--reveal-delay,0ms) both}\n.tile text.flag-pop{transform-box:fill-box;transform-origin:center;animation:flag-pop 260ms ease-out}\n.tile.exploded polygon{animation:mine-flash 650ms ease-out}\n#board.mine-hit{animation:board-shake 380ms ease-in-out}\n@keyframes hex-reveal{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}\n@keyframes flag-pop{0%{opacity:0;transform:scale(.3) rotate(-15deg)}65%{opacity:1;transform:scale(1.3) rotate(5deg)}100%{transform:scale(1) rotate(0)}}\n@keyframes mine-flash{0%,35%{fill:#fff}15%,60%,100%{fill:#E32636}}\n@keyframes board-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}\n@media(prefers-reduced-motion:reduce){.tile.revealing polygon,.tile.revealing text,.tile text.flag-pop,.tile.exploded polygon,#board.mine-hit,.won{animation:none!important}}\n\n[hidden]{display:none!important}\n.ai-corner{display:flex;flex-direction:column;align-items:flex-end;margin-top:12px;gap:7px;text-align:right}\n.ai-password-form{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:7px}\n.ai-password-form input{width:155px;max-width:100%;padding:8px 10px;border:2px solid #555;background:#e9e9e9;color:#111;font: bold 13px 'Comic Sans MS','Comic Sans',cursive}\n.ai-password-form input:focus{outline:2px solid #2364D2;outline-offset:2px}\n.ai-password-form button{font-size:12px;padding:6px 10px}\n#ai-controls{justify-content:flex-end}\n#ai-log{max-width:430px;font-size:12px;line-height:1.5;margin:0;min-height:18px}\n#ai-password-message{font-size:12px;color:#E32636;margin:0;min-height:16px}\n.tile.neighbor-highlight polygon{stroke:#2364D2!important;stroke-width:3!important}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003cmain class=\"app\" id=\"app\"\u003e\u003ch1\u003e\u003cspan class=\"red\"\u003eMOSAIC\u003c/span\u003e\u003cspan class=\"blue\"\u003eSWEEPER\u003c/span\u003e\u003c/h1\u003e\u003cdiv class=\"controls\" aria-label=\"Difficulty\"\u003e\u003cbutton data-level=\"easy\"\u003eEasy\u003c/button\u003e\u003cbutton data-level=\"medium\" class=\"active\"\u003eMedium\u003c/button\u003e\u003cbutton data-level=\"hard\"\u003eHard\u003c/button\u003e\u003cbutton id=\"new\"\u003eNew game\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"stats\"\u003e\u003cdiv class=\"stat\"\u003eFLAGS PLACED\u003cstrong id=\"remaining\"\u003e0\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"stat\"\u003eTIME\u003cstrong id=\"time\"\u003e0:00\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"stat\"\u003eCLEARED\u003cstrong id=\"cleared\"\u003e0 / 105\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv id=\"board-wrap\"\u003e\u003csvg id=\"board\" aria-label=\"Verified Mosaic Minesweeper board\"\u003e\u003c/svg\u003e\u003c/div\u003e\u003cp id=\"status\" role=\"status\" aria-live=\"polite\"\u003eClick any cell to begin.\u003c/p\u003e\u003cp id=\"details\"\u003e\u003c/p\u003e\u003cdiv class=\"rules\"\u003eSingle click to dig \u00b7 Double/right click to place/remove flag\u003cbr\u003e\u003cspan style=\"color:#555\"\u003eKeyboard: Enter to dig \u00b7 F to flag. Only shared edges count. Hover to highlight neighbours. Every board is verified solvable without guessing.\u003c/span\u003e\u003cdiv class=\"legend\"\u003e\u003cspan style=\"color:#2364D2\"\u003e1\u003c/span\u003e\u003cspan style=\"color:#269B48\"\u003e2\u003c/span\u003e\u003cspan style=\"color:#E32636\"\u003e3\u003c/span\u003e\u003cspan style=\"color:#9C47CF\"\u003e4\u003c/span\u003e\u003cspan style=\"color:#FF8C28\"\u003e5\u003c/span\u003e\u003cspan style=\"color:#806300\"\u003e6\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003csection class=\"ai-corner\" aria-label=\"AI controls\"\u003e\n\u003cform id=\"ai-password-form\" class=\"ai-password-form\"\u003e\n\u003cinput id=\"ai-password\" type=\"password\" placeholder=\"AI password\" aria-label=\"AI password\" autocomplete=\"off\" spellcheck=\"false\"\u003e\n\u003cbutton type=\"submit\"\u003eUnlock\u003c/button\u003e\n\u003c/form\u003e\u003cp id=\"ai-password-message\" role=\"status\" aria-live=\"polite\"\u003e\u003c/p\u003e\n\u003cdiv id=\"ai-controls\" class=\"controls\" hidden\u003e\u003cbutton id=\"ai-next\"\u003eSolve next move\u003c/button\u003e\u003cbutton id=\"ai-all\"\u003eSolve all\u003c/button\u003e\u003c/div\u003e\n\u003cp id=\"ai-log\" hidden aria-live=\"polite\"\u003eReady. AI uses visible clues only.\u003c/p\u003e\n\u003c/section\u003e\u003c/main\u003e\n\u003cscript\u003e\n'use strict';\nconst LEVELS={easy:{width:8,height:6,target:61,mines:8,size:70,opening:10},medium:{width:12,height:9,target:127,mines:22,size:48,opening:12},hard:{width:16,height:12,target:217,mines:43,size:36,opening:12}};\nconst DIRS=[[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];\nconst COLORS=['','#2364D2','#269B48','#E32636','#9C47CF','#FF8C28','#806300','#007f86','#b52a79','#484848','#111'];\nconst key=(q,r)=\u003e`${q},${r}`;\n// Shared vertex IDs give exact edge adjacency, without floating-point matching.\nconst edgeKey=(a,b)=\u003ea\u003cb?`${a}:${b}`:`${b}:${a}`;\nfunction edgeOwners(polygons){const edges=new Map();for(const c of polygons)for(let i=0;i\u003cc.vertices.length;i++){const a=c.vertices[i],b=c.vertices[(i+1)%c.vertices.length],id=edgeKey(a,b);if(!edges.has(id))edges.set(id,[]);edges.get(id).push(c)}return edges}\nfunction unionPolygon(a,b,points){\n const boundary=new Map();for(const c of [a,b])for(let i=0;i\u003cc.vertices.length;i++){const u=c.vertices[i],v=c.vertices[(i+1)%c.vertices.length],id=edgeKey(u,v);if(boundary.has(id))boundary.delete(id);else boundary.set(id,[u,v])}\n if(boundary.size\u003c3||boundary.size\u003e6)return null;\n const next=new Map([...boundary.values()]);let cur=next.keys().next().value;const start=cur,verts=[];\n do{if(cur===undefined||verts.includes(cur))return null;verts.push(cur);cur=next.get(cur)}while(cur!==start);\n if(verts.length!==boundary.size)return null;\n // Reject concavity, straight-line extra vertices, and acute slivers.\n for(let i=0;i\u003cverts.length;i++){const p=points[verts[i]],q=points[verts[(i+1)%verts.length]],r=points[verts[(i+2)%verts.length]],ux=q.x-p.x,uy=q.y-p.y,vx=r.x-q.x,vy=r.y-q.y;\n if((ux*vy-uy*vx)/(Math.hypot(ux,uy)*Math.hypot(vx,vy))\u003c.18)return null}\n return {vertices:verts};\n}\nfunction makeMosaic(cfg){\n const W=cfg.width,H=cfg.height,points=[];\n for(let y=0;y\u003c=H;y++)for(let x=0;x\u003c=W;x++)points.push({x:x+(x\u003e0\u0026\u0026x\u003cW?(Math.random()-.5)*.28:0),y:y+(y\u003e0\u0026\u0026y\u003cH?(Math.random()-.5)*.28:0)});\n const at=(x,y)=\u003ey*(W+1)+x;let polygons=[];\n for(let y=0;y\u003cH;y++)for(let x=0;x\u003cW;x++){const a=at(x,y),b=at(x+1,y),c=at(x+1,y+1),d=at(x,y+1);if(Math.random()\u003c.5)polygons.push({vertices:[a,b,c]},{vertices:[a,c,d]});else polygons.push({vertices:[a,b,d]},{vertices:[b,c,d]})}\n while(polygons.length\u003ecfg.target){\n const candidates=[];for(const owners of edgeOwners(polygons).values())if(owners.length===2){const [a,b]=owners,merged=unionPolygon(a,b,points);if(merged){const weight=merged.vertices.length\u003e=5?3:1;candidates.push({a,b,merged,weight})}}\n if(!candidates.length)break;\n let ticket=Math.random()*candidates.reduce((v,c)=\u003ev+c.weight,0),chosen=candidates.at(-1);for(const c of candidates){ticket-=c.weight;if(ticket\u003c=0){chosen=c;break}}\n polygons=polygons.filter(c=\u003ec!==chosen.a\u0026\u0026c!==chosen.b);polygons.push(chosen.merged);\n }\n return {points,polygons};\n}\n// No probability enumeration: local clues, global count, and subset deductions.\nfunction deduceGraph(graph,open,known,numbers,mineTotal){\n const safe=new Set(),mines=new Set(),groups=[],unique=new Set();\n function add(ids,need){if(!ids.length)return;const sorted=ids.slice().sort((a,b)=\u003ea-b),sig=sorted.join(',')+'='+need;if(unique.has(sig))return;unique.add(sig);groups.push({ids:sorted,set:new Set(sorted),need});if(need===0)for(const id of sorted)safe.add(id);else if(need===sorted.length)for(const id of sorted)mines.add(id)}\n for(const i of open){let need=numbers[i];const ids=[];for(const j of graph[i]){if(known.has(j))need--;else if(!open.has(j))ids.push(j)}add(ids,need)}\n const unknown=graph.map((_,i)=\u003ei).filter(i=\u003e!open.has(i)\u0026\u0026!known.has(i));add(unknown,mineTotal-known.size);\n if(!safe.size\u0026\u0026!mines.size)for(let i=0;i\u003cgroups.length;i++)for(let j=0;j\u003cgroups.length;j++){const a=groups[i],b=groups[j];if(a.ids.length\u003e=b.ids.length||!a.ids.every(id=\u003eb.set.has(id)))continue;const diff=b.ids.filter(id=\u003e!a.set.has(id)),need=b.need-a.need;if(need===0)for(const id of diff)safe.add(id);else if(need===diff.length)for(const id of diff)mines.add(id)}\n return {safe,mines};\n}\nfunction verifyLayout(graph,bombs,start,total){\n const numbers=graph.map(ns=\u003ens.reduce((v,i)=\u003ev+bombs[i],0)),open=new Set(),known=new Set();\n function reveal(id){const queue=[id];for(let k=0;k\u003cqueue.length;k++){const i=queue[k];if(open.has(i))continue;if(bombs[i])throw Error('Invalid deduction');open.add(i);if(numbers[i]===0)for(const j of graph[i])if(!open.has(j))queue.push(j)}}\n reveal(start);const opening=open.size;\n while(open.size\u003cgraph.length-total){const d=deduceGraph(graph,open,known,numbers,total);let changed=false;for(const i of d.mines)if(!known.has(i)){if(!bombs[i])throw Error('Invalid mine deduction');known.add(i);changed=true}for(const i of d.safe)if(!open.has(i)){reveal(i);changed=true}if(!changed)break}\n return {solved:open.size===graph.length-total,score:open.size+known.size,opening,open:[...open],known:[...known]};\n}\nasync function generateVerified(payload,progress=()=\u003e{},cancelled=()=\u003efalse){\n const {graph,start,total,minimumOpening}=payload,protectedIds=new Set([start,...graph[start]]),pool=graph.map((_,i)=\u003ei).filter(i=\u003e!protectedIds.has(i));\n let attempts=0,repairs=0;const began=Date.now(),limit=1500,timeLimit=25000;\n while(attempts\u003climit\u0026\u0026Date.now()-began\u003ctimeLimit){\n if(cancelled())throw Error('Generation cancelled.');\n const shuffled=pool.slice();for(let i=0;i\u003ctotal;i++){const j=i+Math.floor(Math.random()*(shuffled.length-i));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}\n let bombs=Array(graph.length).fill(0);for(let i=0;i\u003ctotal;i++)bombs[shuffled[i]]=1;\n let result=verifyLayout(graph,bombs,start,total);attempts++;\n if(result.solved\u0026\u0026result.opening\u003e=minimumOpening)return {bombs,attempts,repairs,ms:Date.now()-began};\n // Local repair: retain only improvements, then verify from the first click.\n // Nothing has been shown yet, so these changes need not preserve old clues.\n if(result.opening\u003e=minimumOpening)for(let repair=0;repair\u003c4\u0026\u0026attempts\u003climit;repair++){\n const opened=new Set(result.open),known=new Set(result.known),frontier=new Set();for(const i of opened)for(const j of graph[i])if(!opened.has(j)\u0026\u0026!known.has(j))frontier.add(j);\n const sources=[...frontier].filter(i=\u003ebombs[i]),destinations=pool.filter(i=\u003e!bombs[i]);if(!sources.length||!destinations.length)break;\n const trial=bombs.slice(),source=sources[Math.floor(Math.random()*sources.length)],dest=destinations[Math.floor(Math.random()*destinations.length)];trial[source]=0;trial[dest]=1;\n const next=verifyLayout(graph,trial,start,total);attempts++;repairs++;\n if(next.solved\u0026\u0026next.opening\u003e=minimumOpening)return {bombs:trial,attempts,repairs,ms:Date.now()-began};\n if(next.opening\u003e=minimumOpening\u0026\u0026next.score\u003eresult.score){bombs=trial;result=next}\n }\n if(attempts%10===0||attempts\u003c6){progress({attempts,repairs,ms:Date.now()-began});await new Promise(resolve=\u003esetTimeout(resolve,0))}\n }\n throw Error('No verified board found within the search limit. Click a cell to retry, or choose New game.');\n}\n\nclass MosaicGame{\n constructor(level='medium'){\n this.level=level;this.config=LEVELS[level];this.cells=new Map();this.started=false;this.finished=false;this.won=false;this.exploded=null;this.startTime=0;this.elapsed=0;\n let mesh;for(let attempt=0;attempt\u003c12;attempt++){mesh=makeMosaic(this.config);if(new Set(mesh.polygons.map(c=\u003ec.vertices.length)).size===4)break}\n this.points=mesh.points;\n for(const c of mesh.polygons){let area=0,cx=0,cy=0;for(let i=0;i\u003cc.vertices.length;i++){const a=this.points[c.vertices[i]],b=this.points[c.vertices[(i+1)%c.vertices.length]],cross=a.x*b.y-b.x*a.y;area+=cross;cx+=(a.x+b.x)*cross;cy+=(a.y+b.y)*cross}c.q=cx/(3*area);c.r=cy/(3*area);c.area=area/2;c.mine=false;c.n=0;c.open=false;c.flag=false;c.neighborIds=[];this.cells.set(key(c.q,c.r),c)}\n for(const owners of edgeOwners(mesh.polygons).values())if(owners.length===2){const [a,b]=owners;a.neighborIds.push(key(b.q,b.r));b.neighborIds.push(key(a.q,a.r))}\n const W=this.config.width,H=this.config.height,centre=mesh.polygons.reduce((a,b)=\u003eMath.hypot(b.q-W/2,b.r-H/2)\u003cMath.hypot(a.q-W/2,a.r-H/2)?b:a);this.centerId=key(centre.q,centre.r);\n }\n neighbors(c){return c.neighborIds.map(id=\u003ethis.cells.get(id))}\n opening(c){const seen=new Set(),queue=[c];for(let i=0;i\u003cqueue.length;i++){const a=queue[i];if(seen.has(a)||a.mine)continue;seen.add(a);if(a.n===0)for(const b of this.neighbors(a))if(!seen.has(b))queue.push(b)}return seen}\n async generate(c){\n if(this.started)return;if(this.generationPromise)return this.generationPromise;\n const cells=[...this.cells.values()],indices=new Map(cells.map((cell,i)=\u003e[key(cell.q,cell.r),i]));\n const payload={graph:cells.map(cell=\u003ecell.neighborIds.map(id=\u003eindices.get(id))),start:indices.get(key(c.q,c.r)),total:this.config.mines,minimumOpening:this.config.opening};\n this.generating=true;this.generationError='';this.generationStats=null;let aborted=false,worker=null,rejectPending;\n const progress=stats=\u003e{if(game===this){this.generationStats=stats;render()}};\n const fallback=()=\u003egenerateVerified(payload,progress
